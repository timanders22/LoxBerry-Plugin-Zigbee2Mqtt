[ServiceConfig]
Desc="Hier findest du die Einstellungen für den Zigbee2Mqtt Dienst"
LabelPermitJoin="Neue Geräte erlauben"
HintPermitJoin="Wenn du alle Geräte angelernt hast, solltest du Einstellung deaktivieren. Sonst könnte eventuell jemand ein fremdes Gerät registrieren."
LabelPort="Zigbee Adapter Pfad"
HintPort="Pfad zum Zigbee Adapter. Am besten einen festen Pfad unter /dev/serial/by-id/ wählen. Ist das Feld leer wird versucht den Adapter automatisch zu erkennen."
PortUnstable="Namen wie /dev/ttyACM0 können sich bei jedem Neustart ändern, sobald ein zweiter USB-Stick steckt (z. B. ein Thread-Stick für Matter2Lox). Dann öffnet Zigbee2MQTT den falschen Stick. Fester Pfad für diesen Adapter:"
PortList="Gefundene Adapter mit festem Pfad:"
LabelEnableUI="Zigbee2mqtt UI aktivieren"
HintEnableUI="Aktviert die Oberfläche von Zigbee2mqtt (siehe https://www.zigbee2mqtt.io/information/frontend.html). Achtung diese ist aktuell noch nicht per Benutzer/Passwort gesichert und kann von überall aufgerufen werden."
LabelAdapter="Adapter Typ"
HintAdapter="Typ des Zigbee Adapters (zstack, ember, dconz, zigate, zboss,...). Siehe https://www.zigbee2mqtt.io/guide/adapters/"
LabelBaudrate="Baudrate"
HintBaudrate="Baudrate der seriellen Verbindung. Leer lassen, dann bleibt der Wert in der configuration.yaml unveraendert und zigbee2mqtt waehlt selbst. Der SONOFF Dongle Max braucht 115200."
LabelRtscts="Hardware-Flusssteuerung (rtscts)"
RtsctsUnset="unveraendert lassen"
HintRtscts="Hardware-Flusssteuerung der seriellen Verbindung. Bleibt es bei unveraendert lassen, wird der Wert in der configuration.yaml nicht angefasst. Der SONOFF Dongle Max braucht false."
LabelChannel="Zigbee-Kanal"
ChannelUnset="unverändert lassen"
HintChannel="Zigbee und Thread (Matter) funken im selben 2,4-GHz-Band mit denselben Kanalnummern 11-26. Beide Netze sollten auf verschiedenen Kanälen liegen, besser mit Abstand. Achtung: nach einem Kanalwechsel müssen alle Zigbee-Geräte neu angelernt werden."
RadioZigbee="Zigbee-Kanal aktuell: %s"
RadioThread="Thread-Kanal: %s (laut %t)"
RadioOk="Zigbee und Thread liegen auf verschiedenen Kanälen."
RadioAdjacent="Zigbee und Thread liegen auf direkt benachbarten Kanälen. Das funktioniert meist, mehr Abstand ist besser."
RadioConflict="Zigbee und Thread liegen auf demselben Kanal! Beide Netze stören sich. Bitte einen der beiden Kanäle ändern."
LabelAvailability="Erreichbarkeit melden"
HintAvailability="Zigbee2MQTT meldet unter <topic>/<gerät>/availability, ob ein Gerät erreichbar ist (online = 1, offline = 0). So sieht Loxone ausgefallene Geräte - wie bei Matter2Lox."
LabelFrontendPort="Port der Zigbee2mqtt UI"
HintFrontendPort="Standard 8881. Nur ändern, wenn ein anderes Plugin diesen Port braucht."

