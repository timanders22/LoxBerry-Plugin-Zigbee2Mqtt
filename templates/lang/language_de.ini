HintForwardMode="Nur Geräte und Gruppen: die großen bridge/*-Nachrichten (Geräteliste, Logging) erreichen den Miniserver nicht. Das entlastet Gateway und Miniserver, die sich Zigbee2Lox mit Matter2Lox und anderen Plugins teilen. Die Liste wird automatisch aktualisiert, wenn Geräte dazukommen oder umbenannt werden."
GatewayV2="Hinweis: Dein MQTT Gateway läuft in Version 2. Dort wählst du die weitergeleiteten Themen im Gateway selbst aus."
LabelHausTopics="Türen und Schlösser unter haus/tuer melden"
HintHausTopics="Meldet Tür-/Fensterkontakte und Schlösser zusätzlich unter haus/tuer/<name>/offen und haus/tuer/<name>/verriegelt (1/0, retained) - dieselbe Hausvereinbarung wie Matter2Lox. Logik in Loxone funktioniert dann gleich, egal ob das Gerät Zigbee oder Matter spricht. Gerätenamen nicht doppelt mit Matter2Lox vergeben. Beim Abschalten werden die Themen wieder gelöscht."

ValInvalidPort="Ein korrekter Port ist eine Zahl zwischen 1 und 65000."
ValInvalidServer="Gib einen korrekten Hostnamen oder eine IP-Adresse ein."
ValInvalidTopic="Das Topic muss mindestens ein Zeich haben. # und + sind nicht gültig."


