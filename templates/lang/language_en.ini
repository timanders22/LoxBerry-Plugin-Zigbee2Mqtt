[ServiceConfig]
Desc="Settings of the zigbee2mqtt service and the Zigbee adapter."
AdapterTitle="Zigbee adapter"
LabelPreset="Coordinator preset"
PresetManual="no preset (set the fields below by hand)"
HintPreset="Fills port, adapter type, baudrate and flow control with the vendor values. Nothing is saved until Save and apply. For the Dongle-M on the network you can use its IP address instead of Dongle-M.local, e.g. tcp://192.168.1.50:6638. For USB please enter the device path yourself, preferably /dev/serial/by-id/..."
LabelPort="Zigbee adapter path"
HintPort="Location of the adapter: /dev/... for USB (preferably a fixed path below /dev/serial/by-id/), tcp://IP:port for network adapters. Leave empty to let zigbee2mqtt find the adapter."
PortUnstable="Names like /dev/ttyACM0 may change on every boot as soon as a second USB stick is plugged in (e.g. a Thread stick for Matter2Lox). zigbee2mqtt then opens the wrong stick. Fixed path of this adapter:"
PortList="Adapters found with a fixed path:"
LabelTestPort="Test connection"
ButtonTestPort="Check port"
HintTestPort="Checks the value of the port field without touching the service: for tcp:// whether the coordinator answers on the network, for /dev/... whether the device exists."
TestReachable="Coordinator reachable"
TestUnreachable="Coordinator does not answer - powered, on the network, right port?"
TestUnresolved="Name cannot be resolved - enter the IP address instead"
TestPresent="Device present"
TestNoAccess="Device present but not readable"
TestMissing="Device not present"
TestEmpty="No port entered"
TestInvalid="Port not recognised - expected tcp://name:port or /dev/..."
LabelAdapter="Adapter type"
AdapterAuto="detect automatically"
HintAdapter="Type of the Zigbee adapter: ember for Silicon Labs chips (e.g. SONOFF Dongle-E, Dongle-M/Max), zstack for Texas Instruments chips (e.g. SONOFF Dongle-P), deconz for ConBee/RaspBee. See https://www.zigbee2mqtt.io/guide/adapters/"
LabelBaudrate="Baudrate"
HintBaudrate="Baudrate of the serial connection. Leave empty to keep whatever is in configuration.yaml and let zigbee2mqtt decide. The SONOFF Dongle Max needs 115200."
LabelRtscts="Hardware flow control (rtscts)"
RtsctsUnset="leave unchanged"
HintRtscts="Hardware flow control of the serial connection. With leave unchanged the value in configuration.yaml is not touched. The SONOFF Dongle Max needs false."
RadioTitle="Radio"
LabelChannel="Zigbee channel"
ChannelUnset="leave unchanged"
HintChannel="Zigbee, Thread (Matter) and WLAN share the 2.4 GHz band. Zigbee and Thread should use different channels, ideally with some distance; channels 15, 20, 25 and 26 lie between the WLAN channels 1, 6 and 11. Caution: after changing the channel all Zigbee devices have to be paired again."
RadioZigbee="Current Zigbee channel: %s"
RadioThread="Thread channel: %s (from %t)"
RadioOk="Zigbee and Thread use different channels."
RadioAdjacent="Zigbee and Thread use neighbouring channels. This usually works, more distance is better."
RadioConflict="Zigbee and Thread use the same channel! Both networks disturb each other. Please change one of the channels."
RadioWifi="WLAN channel of the LoxBerry: %s (%t)"
RadioWifiConflict="The Zigbee channel lies in the middle of the WLAN channel. Zigbee devices then easily lose messages."
RadioWifiNear="The Zigbee channel lies at the edge of the WLAN channel."
LabelAvailability="Report availability"
HintAvailability="Reports under <topic>/<device>/erreichbar whether a device is reachable (1 reachable, 0 not) - the same name as in Matter2Lox. Loxone then sees failed devices."
UITitle="zigbee2mqtt frontend"
LabelEnableUI="Enable Zigbee2mqtt UI"
HintEnableUI="Activates the zigbee2mqtt frontend (see https://www.zigbee2mqtt.io/guide/configuration/frontend.html). It opens from the Devices tab."
LabelFrontendPort="Port of the Zigbee2mqtt UI"
HintFrontendPort="Default 8881. Only change it if another plugin needs this port."
LabelFrontendAuth="Protect the UI with a token"
HintFrontendAuth="Without a token everybody on the network can open the UI, remove devices and change settings. The UI asks for the token when it is opened the first time."
LabelFrontendToken="Token of the UI"
HintFrontendToken="Generated on save. Enter it when the UI is opened the first time."
NotifyTitle="Notifications"
LabelNotifyOffline="Report failed devices"
HintNotifyOffline="Sends a LoxBerry notification when a device is no longer reachable. Reports within a minute are combined. Needs Report availability."
LabelNotifyBattery="Report low batteries"
HintNotifyBattery="Sends a LoxBerry notification when a battery falls below the threshold - once per battery."
LabelBatteryThreshold="Battery threshold (%)"
HintBatteryThreshold="Default 15 percent."
ValFrontendPort="The port of the UI must be a number between 1 and 65535."
ValAdapter="Unknown adapter type."
ValBaudrate="The baudrate must be a number (e.g. 115200) or empty."
ValChannel="The Zigbee channel must be between 11 and 26."
ValBattery="The battery threshold must be a number between 1 and 99."
ValPort="The adapter path must start with /dev/, tcp:// or mdns://."

[Backup]
Title="Backup"
Desc="Downloads a backup of the zigbee2mqtt data as zip, made by zigbee2mqtt itself: configuration, device names and options, the device database and the coordinator backup. With it, a new installation or a new coordinator of the same type can take over the network without pairing all devices again."
Button="Download backup"
Secret="The backup contains the network key of the Zigbee network and the MQTT credentials. Keep it like a password."
Refused="zigbee2mqtt could not create the backup."

[Mqtt]
Desc="Connection to the MQTT broker and forwarding to the Miniserver."
LabelTopic="MQTT Topic"
HintTopic="Base topic of zigbee2mqtt. Every device lives below it: <topic>/<device>."
LabelUseMqttGateway="Use MQTT Gateway credentials"
HintUseMqttGateway="Uses the broker and the credentials of the LoxBerry MQTT Gateway."
LabelRegisterMqttTopic="Register topics on the MQTT Gateway"
HintRegisterMqttTopic="Registers the topics on the MQTT gateway. Then the Zigbee values are sent to the Miniserver."
LabelForwardMode="Forward to the Miniserver"
ForwardDevices="devices and groups only (recommended)"
ForwardAll="everything (<topic>/#)"
HintForwardMode="Devices and groups only: the large bridge/* messages (device list, logging) never reach the Miniserver. This relieves the gateway and the Miniserver, which Zigbee2MqttNG shares with Matter2Lox and other plugins. The list is updated automatically when devices join or are renamed."
GatewayV2="Note: your MQTT gateway runs version 2. There you select the forwarded topics in the gateway itself."
LabelServer="MQTT Broker Server"
HintServer="Hostname or IP address of your MQTT broker."
LabelPort="MQTT Broker Port"
HintPort="Port of your MQTT broker, usually 1883."
LabelUsername="MQTT Broker Username"
HintUsername="Username of your MQTT broker"
LabelPassword="MQTT Broker Password"
HintPassword="Password of your MQTT broker. The saved password is never shown; an empty field keeps it. To delete it, empty the user name as well."
PasswordSet="saved - leave empty to keep it"
LabelHausTopics="Report doors and locks under haus/tuer"
HintHausTopics="Additionally reports door/window contacts and locks under haus/tuer/<name>/offen and haus/tuer/<name>/verriegelt (1/0, retained, - without a statement) - the same house convention as Matter2Lox, read by Funkwacht and Beschattungswächter. <name> stays fixed, even when the device is renamed. A value of another provider is never overwritten. Switching it off removes the topics again."
ValInvalidPort="The port must be a number between 1 and 65535."
ValInvalidServer="Please enter a valid hostname or ip address."
ValInvalidTopic="The topic must not be empty and must not contain #, +, spaces, // or a slash at its start or end."
ValForwardMode="Unknown forwarding."

